name: Build and publish Sphinx docs to GitHub Pages

# Die Dokumentation wird hier gebaut, nicht nur ausgeliefert. Vorher lag das
# erzeugte HTML im Repository und musste vor jedem Push von Hand neu gebaut
# werden — wer das vergaß, veröffentlichte stillschweigend einen alten Stand,
# denn der Workflow lief trotzdem erfolgreich durch.

on:
  push:
    branches: [main]
  # Erlaubt einen Neuaufbau ohne Commit, etwa nach einer Änderung an den
  # Einstellungen von GitHub Pages.
  workflow_dispatch:

permissions:
  contents: write

# Zwei gleichzeitige Deploys würden sich beim Schreiben auf gh-pages
# gegenseitig überholen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Sphinx installieren
        run: pip install -r docs/requirements.txt

      # -d legt die Zwischendateien neben die Seite statt hinein. Ohne das
      # landen rund 290 KB gepickelter Build-Cache mit auf gh-pages — mehr,
      # als die Seite selbst wiegt.
      #
      # -W macht jede Sphinx-Warnung zum Fehler, --keep-going zeigt dabei alle
      # statt nur der ersten. Ein toter Querverweis bricht damit die
      # Veröffentlichung, statt unbemerkt online zu gehen.
      - name: Dokumentation bauen
        run: sphinx-build -W --keep-going -b html -d docs/_build/doctrees docs docs/_build/html

      - name: Deno einrichten
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Prueft, ob jedes exportierte Symbol einen JSDoc-Kommentar hat.
      #
      # Gewertet wird nur `missing-jsdoc`, und nur wenn die Fundstelle auf
      # unseren eigenen Quelltext zeigt. Die uebrigen Meldungen von
      # `deno doc --lint` sind `private-type-ref` auf polars' `DataFrame`:
      # unvermeidbar, solange dieses Modul Polars-Datenrahmen zurueckgibt, und
      # abstellbar nur durch einen Re-Export, der die erzeugte API-Referenz von
      # 1,4 auf 4,7 MB aufblaeht. Der Tausch lohnt nicht.
      - name: API-Dokumentation pruefen
        env:
          # Ohne das umgibt Deno die Fundstellen mit ANSI-Sequenzen, an denen
          # das Muster unten vorbeigreift.
          NO_COLOR: "1"
        run: |
          deno doc --lint sir3sjs/mx.ts > doclint.txt 2>&1 || true
          # -A2, weil die Fundstelle in der Zeile unter der Fehlermeldung steht.
          # Pfadtrenner offen halten: Deno meldet den Pfad in der Schreibweise
          # des Betriebssystems, unter Windows also mit Backslash.
          if grep -A2 'error\[missing-jsdoc\]' doclint.txt \
             | grep -qE '^[[:space:]]*-->.*sir3sjs[/\\]mx\.ts'; then
            echo "::error::Exportierte Symbole ohne JSDoc in sir3sjs/mx.ts"
            grep -A2 'error\[missing-jsdoc\]' doclint.txt | grep -E 'error|-->'
            exit 1
          fi
          echo "Alle exportierten Symbole in sir3sjs/mx.ts sind dokumentiert."

      # Die API-Referenz entsteht aus den JSDoc-Kommentaren im Quelltext und
      # landet als Unterverzeichnis in der fertigen Seite. Muss nach dem
      # Sphinx-Lauf kommen, weil dieser das Ausgabeverzeichnis anlegt.
      - name: API-Referenz erzeugen
        run: >
          deno doc --html --name="sir3sjs"
          --output=docs/_build/html/api
          sir3sjs/mx.ts

      - name: Nach GitHub Pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
