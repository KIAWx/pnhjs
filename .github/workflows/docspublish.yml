name: Build and publish Sphinx docs to GitHub Pages

# Die Dokumentation wird hier gebaut, nicht nur ausgeliefert. Vorher lag das
# erzeugte HTML im Repository und musste vor jedem Push von Hand neu gebaut
# werden — wer das vergaß, veröffentlichte stillschweigend einen alten Stand,
# denn der Workflow lief trotzdem erfolgreich durch.

on:
  push:
    branches: [main]
  # Erlaubt einen Neuaufbau ohne Commit, etwa nach einer Änderung an den
  # Einstellungen von GitHub Pages.
  workflow_dispatch:

permissions:
  contents: write

# Zwei gleichzeitige Deploys würden sich beim Schreiben auf gh-pages
# gegenseitig überholen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Sphinx installieren
        run: pip install -r docs/requirements.txt

      # -d legt die Zwischendateien neben die Seite statt hinein. Ohne das
      # landen rund 290 KB gepickelter Build-Cache mit auf gh-pages — mehr,
      # als die Seite selbst wiegt.
      #
      # -W macht jede Sphinx-Warnung zum Fehler, --keep-going zeigt dabei alle
      # statt nur der ersten. Ein toter Querverweis bricht damit die
      # Veröffentlichung, statt unbemerkt online zu gehen.
      - name: Dokumentation bauen
        run: sphinx-build -W --keep-going -b html -d docs/_build/doctrees docs docs/_build/html

      - name: Deno einrichten
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Die API-Referenz entsteht aus den JSDoc-Kommentaren im Quelltext und
      # landet als Unterverzeichnis in der fertigen Seite. Muss nach dem
      # Sphinx-Lauf kommen, weil dieser das Ausgabeverzeichnis anlegt.
      - name: API-Referenz erzeugen
        run: >
          deno doc --html --name="sir3sjs"
          --output=docs/_build/html/api
          sir3sjs/mx.ts

      - name: Nach GitHub Pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
